# Control catalog for aws-compliance-as-code.
# Each control maps to one Python check function and to four frameworks:
#   nist_800_53 - NIST SP 800-53 Rev. 5
#   soc2        - AICPA Trust Services Criteria (2017, rev. 2022)
#   iso27001    - ISO/IEC 27001:2022 Annex A
#   cis_aws     - CIS Amazon Web Services Foundations Benchmark v3.0.0
# An entry starting with "N/A" means the framework has no direct equivalent and says why.

controls:
  # --- Identity and access ---------------------------------------------------
  - id: IAM-01
    title: Root account has MFA enabled
    check: check_root_mfa
    description: Root sign-in must require MFA.
    mappings:
      nist_800_53: [IA-2(1)]
      soc2: [CC6.1]
      iso27001: [A.5.17, A.8.5]
      cis_aws: ["1.5"]

  - id: IAM-02
    title: Root account has no access keys
    check: check_root_access_keys
    description: The root user must not have active programmatic access keys.
    mappings:
      nist_800_53: [AC-6(2), IA-2]
      soc2: [CC6.1]
      iso27001: [A.8.2, A.8.5]
      cis_aws: ["1.4"]

  - id: IAM-03
    title: IAM password policy meets minimum strength
    check: check_password_policy
    description: Account password policy requires 14+ characters and prevents reuse of the last 24 passwords.
    mappings:
      nist_800_53: [IA-5(1)]
      soc2: [CC6.1]
      iso27001: [A.5.17]
      cis_aws: ["1.8", "1.9"]

  - id: IAM-04
    title: Access keys are rotated within 90 days
    check: check_access_key_age
    description: No active IAM user access key may be older than 90 days.
    mappings:
      nist_800_53: [IA-5(1), AC-2]
      soc2: [CC6.1]
      iso27001: [A.5.17]
      cis_aws: ["1.14"]

  - id: IAM-05
    title: Unused credentials are disabled
    check: check_unused_credentials
    description: Passwords and access keys unused for 45 days or more must be disabled.
    mappings:
      nist_800_53: [AC-2(3)]
      soc2: [CC6.2]
      iso27001: [A.5.18]
      cis_aws: ["1.12"]

  - id: IAM-06
    title: No policies grant full "*:*" administrative privileges
    check: check_no_wildcard_admin
    description: No customer-managed IAM policy may allow Action "*" on Resource "*".
    mappings:
      nist_800_53: [AC-6]
      soc2: [CC6.3]
      iso27001: [A.5.15, A.8.2]
      cis_aws: ["1.16"]

  # --- Logging ---------------------------------------------------------------
  - id: LOG-01
    title: CloudTrail is enabled in all regions
    check: check_cloudtrail_multi_region
    description: At least one multi-region trail must be logging management events.
    mappings:
      nist_800_53: [AU-2, AU-12]
      soc2: [CC7.2]
      iso27001: [A.8.15]
      cis_aws: ["3.1"]

  - id: LOG-02
    title: CloudTrail log file validation is enabled
    check: check_cloudtrail_log_validation
    description: Every trail must have log file integrity validation turned on.
    mappings:
      nist_800_53: [AU-9]
      soc2: [CC7.2]
      iso27001: [A.8.15]
      cis_aws: ["3.2"]

  # --- Data protection -------------------------------------------------------
  - id: DATA-01
    title: S3 Block Public Access is enabled at the account level
    check: check_s3_account_public_access_block
    description: All four account-level S3 Block Public Access settings must be true.
    mappings:
      nist_800_53: [AC-3, SC-7]
      soc2: [CC6.1, CC6.6]
      iso27001: [A.8.3]
      cis_aws: ["2.1.4"]

  - id: DATA-02
    title: S3 buckets have default encryption configured
    check: check_s3_default_encryption
    description: Every S3 bucket must have a default server-side encryption configuration (SSE-S3 or SSE-KMS).
    mappings:
      nist_800_53: [SC-28]
      soc2: [CC6.1]
      iso27001: [A.8.24]
      cis_aws: ["N/A - removed in CIS v2.0; AWS encrypts new buckets by default (SSE-S3)"]

  - id: DATA-03
    title: EBS encryption by default is enabled
    check: check_ebs_default_encryption
    description: EBS encryption-by-default must be on in every enabled region.
    mappings:
      nist_800_53: [SC-28]
      soc2: [CC6.1]
      iso27001: [A.8.24]
      cis_aws: ["2.2.1"]

  # --- Detection and monitoring ----------------------------------------------
  - id: DET-01
    title: GuardDuty is enabled
    check: check_guardduty_enabled
    description: A GuardDuty detector must exist and be ENABLED in every enabled region.
    mappings:
      nist_800_53: [SI-4]
      soc2: [CC7.2]
      iso27001: [A.8.16]
      cis_aws: ["N/A - no GuardDuty control in CIS AWS Foundations v3.0"]

  - id: DET-02
    title: Security Hub is enabled
    check: check_securityhub_enabled
    description: AWS Security Hub must be enabled in every enabled region.
    mappings:
      nist_800_53: [CA-7, SI-4]
      soc2: [CC7.1]
      iso27001: [A.8.16]
      cis_aws: ["4.16"]

  - id: NET-01
    title: VPC flow logs are enabled
    check: check_vpc_flow_logs
    description: Every VPC must have at least one active flow log capturing REJECT (or ALL) traffic.
    mappings:
      nist_800_53: [AU-12, SI-4]
      soc2: [CC7.2]
      iso27001: [A.8.15, A.8.16]
      cis_aws: ["3.7"]

  # --- Configuration management ----------------------------------------------
  - id: CFG-01
    title: AWS Config recorder is on
    check: check_config_recorder
    description: An AWS Config recorder must be recording all resource types in every enabled region.
    mappings:
      nist_800_53: [CM-2, CM-8]
      soc2: [CC7.1]
      iso27001: [A.8.9]
      cis_aws: ["3.3"]
