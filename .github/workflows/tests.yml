name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      # Every dependency is pinned by version and hash (see requirements.in).
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Lint (syntax errors and undefined names fail the build)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan with Bandit
        run: bandit -r aws_compliance_as_code run.py oscal_export.py -ll

      # Build the wheel with the hash-locked setuptools, then install that file, so nothing is
      # fetched unpinned.
      - name: Install the package
        run: |
          python -c "from setuptools import build_meta as b; b.build_wheel('dist')"
          pip install --no-deps dist/*.whl

      - name: Run tests
        run: python -m pytest -q

      # The demo builds a misconfigured fake account with moto and writes evidence, OSCAL and a
      # report; the statuses must match the committed sample (IDs and timestamps from moto vary).
      - name: Demo matches the committed sample
        env:
          SOURCE_DATE_EPOCH: '1792540800'
        run: |
          aws-compliance-as-code demo --out /tmp/demo
          diff <(grep -h '"status"' /tmp/demo/evidence/*.json) <(grep -h '"status"' sample-output/evidence/*.json)
          diff /tmp/demo/report.md sample-output/report.md
