name: Nightly compliance evidence

on:
  schedule: [{cron: '30 3 * * *'}]   # 03:30 UTC every day
  workflow_dispatch: {}

permissions: {id-token: write, contents: write}

concurrency: nightly-evidence

jobs:
  # Without AWS_ROLE_ARN there is no role to assume, so report that instead of
  # failing every night. Deploy infra/github-oidc.yaml and set the variable to enable collection.
  not-configured:
    if: ${{ vars.AWS_ROLE_ARN == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning title=Evidence collection disabled::AWS_ROLE_ARN repository variable is not set. See 'Run it nightly' in README.md."

  collect:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: pip install boto3 pyyaml

      # Short-lived credentials via OIDC; no AWS keys are stored in GitHub.
      # AWS_ROLE_ARN is a repository variable (Settings -> Secrets and variables -> Actions -> Variables).
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: nightly-evidence
          aws-region: us-east-1

      - name: Run checks and write hashed evidence
        run: python run.py

      - name: Export OSCAL assessment results
        run: python oscal_export.py

      - name: Commit evidence and OSCAL output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence oscal
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "evidence: nightly run $(date -u +%F)"
            git push
          fi
